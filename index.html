<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechZone - Customer Registration</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ea;
            color: #222;
        }

        header, footer {
            background: #202020;
            color: white;
            text-align: center;
            padding: 20px;
        }

        header h1 { color: #ff5b2e; }

        .container {
            max-width: 750px;
            margin: 25px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
        }

        h2 { color: #ff5b2e; }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .choice label {
            display: inline-block;
            margin-right: 15px;
        }

        .choice input { width: auto; }

        button {
            background: #202020;
            color: white;
            padding: 11px 20px;
            border: none;
            margin-top: 18px;
            cursor: pointer;
        }

        button:hover { background: #ff5b2e; }

        #message { margin-top: 15px; }

        .success { color: green; }
        .error { color: red; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #202020;
            color: white;
        }

        .table-wrap { overflow-x: auto; }

        @media(max-width: 600px) {
            .container { margin: 15px; padding: 18px; }
        }
    </style>
</head>

<body>

<header>
    <h1>TECHZONE</h1>
    <p>Electronics Store - Customer Registration</p>
</header>

<div class="container">
    <h2>User Registration Form</h2>

    <form id="registerForm">

        <label>Name *</label>
        <input type="text" name="name"
               pattern="[A-Za-z ]+" required
               placeholder="Enter your name">

        <label>Password *</label>
        <input type="password" name="password"
               minlength="8"
               pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9]).{8,}"
               title="Minimum 8 characters with uppercase, lowercase and number"
               required placeholder="Enter password">

        <label>Age *</label>
        <input type="number" name="age"
               min="18" max="30" required
               placeholder="Enter your age">

        <label>Mobile Number *</label>
        <input type="tel" name="mobile"
               pattern="[0-9]{10}" maxlength="10"
               required placeholder="10 digit mobile number">

        <label>Email *</label>
        <input type="email" name="email"
               required placeholder="Enter email">

        <label>Gender *</label>
        <div class="choice">
            <label>
                <input type="radio" name="gender"
                       value="Male" required> Male
            </label>
            <label>
                <input type="radio" name="gender"
                       value="Female"> Female
            </label>
        </div>

        <label>State *</label>
        <select name="state" required>
            <option value="">Select State</option>
            <option>Tamil Nadu</option>
            <option>Kerala</option>
            <option>Karnataka</option>
            <option>Andhra Pradesh</option>
            <option>Telangana</option>
        </select>

        <label>Skills *</label>
        <div class="choice">
            <label><input type="checkbox" name="skills" value="JavaScript"> JavaScript</label>
            <label><input type="checkbox" name="skills" value="Python"> Python</label>
            <label><input type="checkbox" name="skills" value="C++"> C++</label>
            <label><input type="checkbox" name="skills" value="Java"> Java</label>
        </div>

        <button type="submit">Register Customer</button>
    </form>

    <p id="message"></p>
</div>

<div class="container">
    <h2>Registered TechZone Customers</h2>

    <button type="button" onclick="loadCustomers()">
        Refresh Records
    </button>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Mobile</th>
                    <th>Email</th>
                    <th>Gender</th>
                    <th>State</th>
                    <th>Skills</th>
                </tr>
            </thead>
            <tbody id="customerList">
                <tr>
                    <td colspan="7">Loading customer records...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<footer>
    <p>TechZone Electronics Store | Experiment 10</p>
</footer>

<script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");

    // Submit registration form
    form.addEventListener("submit", async function(event) {
        event.preventDefault();

        const data = Object.fromEntries(new FormData(form));
        data.skills = Array.from(
            form.querySelectorAll('input[name="skills"]:checked')
        ).map(input => input.value);

        if (data.skills.length === 0) {
            message.textContent = "Please select at least one skill.";
            message.className = "error";
            return;
        }

        try {
            const response = await fetch("/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) throw new Error(result.message);

            message.textContent = result.message;
            message.className = "success";

            form.reset();
            loadCustomers();

        } catch (error) {
            message.textContent = error.message || "Registration failed.";
            message.className = "error";
        }
    });

    // Display customer records
    async function loadCustomers() {
        const table = document.getElementById("customerList");

        try {
            const response = await fetch("/customers");
            if (!response.ok) throw new Error("Unable to load records");

            const customers = await response.json();

            table.innerHTML = "";

            if (customers.length === 0) {
                table.innerHTML =
                    '<tr><td colspan="7">No customers registered.</td></tr>';
                return;
            }

            customers.forEach(customer => {
                const row = document.createElement("tr");

                [
                    customer.name,
                    customer.age,
                    customer.mobile,
                    customer.email,
                    customer.gender,
                    customer.state,
                    (customer.skills || []).join(", ")
                ].forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                table.appendChild(row);
            });

        } catch (error) {
            table.innerHTML =
                '<tr><td colspan="7">Could not load customer records.</td></tr>';
        }
    }

    loadCustomers();
</script>

</body>
</html>
